services:
  - type: web
    name: autocut-studio-v34
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: TRANSCRIBE_MODEL
        value: gpt-transcribe
      - key: FFMPEG_BIN
        value: ffmpeg
      - key: FFPROBE_BIN
        value: ffprobe
      - key: FFMPEG_PRESET
        value: veryfast
      - key: FFMPEG_CRF
        value: "20"
      - key: MAX_UPLOAD_MB
        value: "1500"
